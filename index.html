<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#f4f1ea">
    <script>
      (function () {
        var theme = "light";

        try {
          var saved = localStorage.getItem("ev-portfolio-theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch (error) {
          // Storage may be blocked. Light remains the default.
        }

        var root = document.documentElement;

        root.classList.add(theme);
        root.setAttribute("data-theme", theme);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "dark" ? "#161815" : "#f4f1ea");
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eric Veliyulin | Frontendspesialist</title>
    <meta name="description" content="Eric Veliyulin — frontendspesialist på frilans. Fem år med React, Vue og TypeScript. Testdekning og tilgjengelighet som standard.">
  </head>
  <body>
    <!--

      borrowed-artifact conceit and the neon dark developer-portfolio default in equal measure.

      #1F4D3C owning the project region full-bleed, signal orange #E4572E owning every action.
      Cabinet Grotesk for voice, Martian Mono for measurement. Hairline rules, never cards.
      STORY: This is a frontend specialist with production evidence and public platform
      expertise; he is worth an email today.
      FIRST VIEWPORT: Name at display scale ranged left, role line in mono beneath it, lede at
      44ch, then a full-width proof rail naming ASKO, Røde Kors and NDC London before the
      signal-filled freelance inquiry and visible email fallback. Green project field breaks at
      the fold.
      FORM: Category standard, played straight — extended by approved full-width proof-rail
      composition B. Original seed key 1959238f.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
